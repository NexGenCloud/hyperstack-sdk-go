version: '3'

silent: true

vars:
  DIR_ARTIFACTS: "{{.ROOT_DIR}}/artifacts"
  DIR_DATA: "{{.ROOT_DIR}}/data"
  API_SPEC_PATH: "{{.DIR_ARTIFACTS}}/api.json"
  LIB_DIR: "lib"
  DIR_PACKAGE: "{{.ROOT_DIR}}/{{.LIB_DIR}}"
  # Stamped into the forced client headers. Set from the release tag in CI; falls back
  # to "dev" for local runs so a build never silently ships an empty version.
  SDK_VERSION: '{{.SDK_VERSION | default (env "SDK_VERSION") | default "dev"}}'
  HYPERSTACK_API_ADDRESS: "https://infrahub-api.nexgencloud.com/v1"

env:
  HYPERSTACK_STAGING: "true"

  HYPERSTACK_API_KEY: ~
  HYPERSTACK_API_ADDRESS: "{{.HYPERSTACK_API_ADDRESS}}"
  HYPERSTACK_API_SPEC_ADDRESS: "https://infrahub-api-doc.nexgencloud.com/api.json"

tasks:
  init:
    desc: |
      Install all the necessary dependencies
    vars:
      DEPS: |-
        github.com/deepmap/oapi-codegen/cmd/oapi-codegen
    cmds:
      # language=bash
      - |
        # TODO: check go.mod
        # go install
        go get {{.DEPS}}
        go install {{.DEPS}}

  build:
    desc: |
      Generates go sdk file from api.json
    vars:
      SPEC_PATH: |-
        https://infrahub-api-doc.nexgencloud.com/api.json
      # TODO: from go.mod
      PROJECT: "github.com\\/NexGenCloud\\/hyperstack-sdk-go"
      TIME_PACKAGE: "time"
    env:
      DIR_ARTIFACTS: "{{.DIR_ARTIFACTS}}"
      DIR_PACKAGE: "{{.DIR_PACKAGE}}"
    cmds:
      # language=bash
      - |
        echo -n "Generating Go SDK... "
        go run sdk_generator.go
        mkdir -p "{{.DIR_PACKAGE}}/{{.TIME_PACKAGE}}"
        find "{{.DIR_PACKAGE}}" \
          -name "*.go" \
          -exec bash -c 'sed -i.tmp -e "s/time\.Time/{{.TIME_PACKAGE}}.CustomTime/g" "$1" && rm "$1.tmp"' _ {} \;
        find "{{.DIR_PACKAGE}}" \
          -name "*.go" \
          -exec bash -c 'sed -i.tmp -e '"'"'s/"time"/"{{.PROJECT}}\/{{.LIB_DIR}}\/{{.TIME_PACKAGE}}"/g'"'"' "$1" && rm "$1.tmp"' _ {} \;
        sed 's/PACKAGE_REPLACE/{{.TIME_PACKAGE}}/g' "{{.DIR_DATA}}/CustomTime.go" \
          > "{{.DIR_PACKAGE}}/{{.TIME_PACKAGE}}/CustomTime.go"
        echo "done"
      # language=bash
      - |
        # Forced Hyperstack client identification headers.
        #
        # This is the client that actually ships as hyperstack-sdk-go, so it needs the
        # same headers as the other five SDKs. oapi-codegen emits one package per API
        # tag, each with its own applyEditors -- the single point every operation routes
        # through before the request is sent.
        #
        # The helper goes in its own file in each tag package so the generated client
        # needs no extra imports, and is invoked with `defer` at the top of applyEditors
        # so it runs after every configured RequestEditorFn: a caller cannot override it.
        echo -n "Injecting forced Hyperstack client headers... "
        injected=0
        for pkg_dir in "{{.DIR_PACKAGE}}"/*/; do
          pkg_name="$(basename "$pkg_dir")"
          # the shared time package holds no client, skip it
          [ "$pkg_name" = "{{.TIME_PACKAGE}}" ] && continue
          client_file="$pkg_dir$pkg_name"_client.go
          [ -f "$client_file" ] || continue
          sed -e "s/PACKAGE_REPLACE/$pkg_name/g" \
              -e 's/__HYPERSTACK_SDK_VERSION__/{{.SDK_VERSION}}/g' \
              "{{.DIR_DATA}}/HyperstackHeaders.go" > "$pkg_dir/HyperstackHeaders.go"
          if ! grep -q 'hyperstackSetHeaders' "$client_file"; then
            sed -i.tmp 's|\(applyEditors(ctx context.Context, req \*http.Request, additionalEditors \[\]RequestEditorFn) error {\)|\1 defer hyperstackSetHeaders(req)|' "$client_file"
            rm -f "$client_file.tmp"
          fi
          grep -q 'defer hyperstackSetHeaders(req)' "$client_file" || {
            echo ""; echo "FATAL: applyEditors anchor not found in $client_file"; exit 1
          }
          injected=$((injected + 1))
        done
        if [ "$injected" -eq 0 ]; then
          echo ""; echo "FATAL: no generated tag packages found under {{.DIR_PACKAGE}}"; exit 1
        fi
        if grep -rl '__HYPERSTACK_SDK_VERSION__' "{{.DIR_PACKAGE}}" 2>/dev/null | grep -q .; then
          echo ""; echo "FATAL: unsubstituted version placeholder remains"; exit 1
        fi
        echo "done ($injected packages)"

  build-api-spec:
    desc: |
      Pulls the latest api.json from the server
    dotenv: [ '.env' ]
    vars:
      SCRIPTS_DIR: "scripts"
      SORT_SCHEMAS: "{{.SCRIPTS_DIR}}/sort_schemas.py"
      FIX_API_SPEC: "{{.SCRIPTS_DIR}}/fix_api_spec.py"
    cmds:
      # language=bash
      - |
        echo -n "Pulling the latest OpenAPI spec... "
        mkdir -p "{{.DIR_ARTIFACTS}}"
        curl -fsSL "${HYPERSTACK_API_SPEC_ADDRESS}" -o "{{.API_SPEC_PATH}}"
        echo "done"
        echo -n "Fixing api spec... "
        python3 "{{.SORT_SCHEMAS}}" "{{.API_SPEC_PATH}}"
        python3 "{{.FIX_API_SPEC}}" "{{.API_SPEC_PATH}}"
        echo "done"

  test:
    desc: |
      Runs tests
    env:
      DIR_ARTIFACTS: "{{.DIR_ARTIFACTS}}"
    cmds:
      # language=bash
      - go test -v sdk_generator_test.go